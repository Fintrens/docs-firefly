# ============================================================================
#  docs.firefly.fintrens.com — retired. Every old VuePress URL answers 301 to its new home on
#  fintrens.com, so links and search rankings carry over to /backtests/.
#
#  Installed BY HAND at cutover as /etc/nginx/conf.d/docs.firefly.fintrens.com.conf, replacing the
#  vhost that served the VuePress build (see site/DEPLOY.md). The deploy workflow never touches it.
#  server_name and the certificate paths were checked against the live vhost on 14 Nov 2026.
# ============================================================================

map $uri $ff_docs_to {
    default                                                              /backtests/;
    # every backtest table (strategy overviews and per-year trade tables) falls through to the default: the backtests home page
    # guide pages: the closest page on fintrens.com
    ~*^/guide/backtesting-results(?:\.html|/)?$                           /backtests/;
    ~*^/guide/(?:algorithmic-trading|the-world-of-quantitative-trading)(?:\.html|/)?$   /what-is-algo-trading/;
    ~*^/guide(?:/.*)?$                                                    /methodology/;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.firefly.fintrens.com www.docs.firefly.fintrens.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }     # certificate renewals keep working
    location / { return 301 https://fintrens.com$ff_docs_to; }
}

server {
    listen 443 ssl http2;            # same form as the fintrens.com vhost on this server
    listen [::]:443 ssl http2;
    server_name docs.firefly.fintrens.com www.docs.firefly.fintrens.com;

    ssl_certificate     /etc/letsencrypt/live/docs.firefly.fintrens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.firefly.fintrens.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;      # Certbot's TLS settings, as the other vhosts on this server use

    location / { return 301 https://fintrens.com$ff_docs_to; }
}
