# ============================================================================
#  Firefly backtests — everything fintrens.com serves under /backtests/
#  Installed as /etc/nginx/fintrens.d/backtests.conf by the deploy workflow
#  (.github/workflows/deploy-backtests.yml) and pulled into the fintrens.com server{}
#  (fintrens-home repo, fintrens.com.conf) by   include /etc/nginx/fintrens.d/*.conf;
#  NOT conf.d/: files there load at http{} level, where `location` is not allowed.
#
#  Inherited from the fintrens.com server block, so not repeated here: gzip_static (the build
#  pre-compresses every html/js/json/csv/xml file), the security headers and Cache-Control
#  ($fx_cache: 1 year for js, whose file name carries a content hash; 5 minutes for HTML, JSON and
#  the CSV trade logs). Never put an add_header in these locations — it would drop every inherited
#  header for them.
#
#  WEBROOT (/srv/www/static/fintrens) holds the `backtests` symlink the workflow flips to the live
#  release in WEBROOT/backtests-releases/<tag>-<stamp>/. Plain prefix locations (no ^~), so the
#  server's `location ~ /\.` rule still hides dotfiles such as the release's copy of this file.
# ============================================================================

location = /backtests { return 301 /backtests/; }

location /backtests/ {
    root /srv/www/static/fintrens;           # /backtests/x → WEBROOT/backtests/x (the symlink)
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /backtests/404.html;
}
